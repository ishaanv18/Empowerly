# Server Configuration
server.port=8080
spring.application.name=empowerly-backend

# MongoDB Configuration
# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=empowerly

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Resend Configuration
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Groq API Configuration
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# System-wide Rate Limits (Groq Free Tier)
groq.tokens.per.minute=18000
groq.requests.per.day=14400

# Per-User Daily Limits (to prevent quota exhaustion)
groq.user.tokens.per.day=500
groq.user.requests.per.day=50

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# OTP Configuration
otp.expiry.minutes=5
otp.length=6

# Logging
logging.level.com.empowerly=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# Timezone Configuration
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
